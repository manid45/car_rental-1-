<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - DriveEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">Drive<span>Easy</span> Admin</div>
    <div class="nav-right">
      <span id="welcome"></span>
      <button class="btn amber small" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat"><b id="statCars">0</b>Cars</div>
      <div class="stat"><b id="statUsers">0</b>Customers</div>
      <div class="stat"><b id="statBookings">0</b>Bookings</div>
      <div class="stat"><b id="statIncome">0</b>Confirmed income (Rs.)</div>
    </div>

    <h2>Add a car</h2>
    <form class="add-car-form" id="carForm">
      <div><label>Car name</label><input type="text" id="carName" required></div>
      <div><label>Type</label>
        <select id="carType">
          <option>Hatchback</option><option>Sedan</option><option>SUV</option><option>MPV</option>
        </select>
      </div>
      <div><label>Seats</label><input type="number" id="carSeats" min="2" max="12" required></div>
      <div><label>Fuel</label>
        <select id="carFuel"><option>Petrol</option><option>Diesel</option><option>Electric</option></select>
      </div>
      <div><label>Price / day (Rs.)</label><input type="number" id="carPrice" min="100" required></div>
      <button class="btn" type="submit">Add car</button>
    </form>

    <h2>All cars</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Seats</th><th>Fuel</th><th>Price/day</th><th>Action</th></tr></thead>
        <tbody id="carTable"></tbody>
      </table>
    </div>

    <h2>All bookings (with customer details)</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Customer</th><th>Phone</th><th>Licence</th><th>Car</th><th>From</th><th>To</th><th>Total</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="bookingTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
